<mgl-map
	(mapLoad)="map = $event"
	[style]="LayerDict[currentLayer]"
	[zoom]="[7.5]"
	[minZoom]="7.5"
	[maxZoom]="20"
	[attributionControl]="false"
	[maxBounds]="[
		[5.5, 45.5],
		[11.0, 48.0],
	]">
	<mgl-control mglFullscreen></mgl-control>
	<mgl-control position="bottom-left"
		><button
			(click)="openMapAdminDialog(mapAdminDialog)"
			mat-button
			obButton="secondary"
			target="_blank"
			id="mapLinkButton">
			<mat-icon svgIcon="login" class="ob-icon"></mat-icon>
			map.geo.admin.ch
		</button></mgl-control
	>
	<mgl-control position="bottom-right">
		<mat-button-toggle-group
			name="background"
			aria-label="Background Layer"
			[(value)]="currentLayer"
			[hideSingleSelectionIndicator]="true">
			<ng-container *ngFor="let enum of BackgroundLayers | keyvalue">
				<mat-button-toggle (click)="persistBackgroundLayer()" [value]="enum.value"
					>{{ "map.background." + enum.value | translate }}
				</mat-button-toggle>
			</ng-container>
		</mat-button-toggle-group>
	</mgl-control>
</mgl-map>

<ng-template #mapAdminDialog id="mapAdminDialog">
	<h2 mat-dialog-title>{{ "map.adminCHDialog.title" | translate }}</h2>
	<mat-dialog-content class="mat-typography" [innerHTML]="'map.adminCHDialog.description' | translate">
	</mat-dialog-content>
	<mat-dialog-actions>
		<button mat-button obButton="secondary" [mat-dialog-close]="false">
			{{ "i18n.common.cancel" | translate }}
		</button>
		<button mat-button obButton="primary" [mat-dialog-close]="true" cdkFocusInitial>
			{{ "map.adminCHDialog.button" | translate }}<b> map.geo.admin.ch</b>
		</button>
	</mat-dialog-actions>
</ng-template>
