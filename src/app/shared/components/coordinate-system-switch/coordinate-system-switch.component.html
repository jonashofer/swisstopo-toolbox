<ng-template #switchPopover>
	<mat-button-toggle-group
		name="coordinateSystem"
		[ngModel]="currentSystem$ | async"
		(ngModelChange)="onChange($event)"
		aria-label="Coordinate System"
		[hideSingleSelectionIndicator]="true">
		@for (system of coordinateSystems; track system) {
			<mat-button-toggle [value]="system">
				{{ coordinateSystemNames[system] }}
			</mat-button-toggle>
		}
	</mat-button-toggle-group>
</ng-template>

<button
	mat-button
	obButton="secondary"
	[obPopover]="switchPopover"
	placement="bottom"
	[matTooltip]="'toolbar.coordinateSystem.tooltip' | translate"
	matTooltipPosition="after"
	matTooltipShowDelay="100">
	{{ currentSystemName$ | async }}
	<mat-icon iconPositionEnd svgIcon="globe" class="ob-icon"></mat-icon>
	<mat-icon iconPositionEnd svgIcon="chevron_down-small" class="ob-icon"></mat-icon>
</button>
